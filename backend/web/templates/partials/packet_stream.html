{# Decorative hero visual: packet sizes scrolling past the fuzzy-GCD lattice. #}
<figure class="stream" aria-hidden="true">
  <div class="stream-head">
    <span class="stream-title"><span class="pulse"></span>Packet-size rhythm</span>
    <span class="stream-chip">k = {{ hero.k }} B</span>
  </div>

  <svg viewBox="0 0 520 230" class="stream-svg">
    <defs>
      <linearGradient id="stream-on" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: var(--on-1)" />
        <stop offset="1" style="stop-color: var(--on-2)" stop-opacity="0.6" />
      </linearGradient>
      <linearGradient id="stream-off" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: var(--off-1)" />
        <stop offset="1" style="stop-color: var(--off-2)" stop-opacity="0.6" />
      </linearGradient>
      <linearGradient id="stream-scan" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color: var(--accent)" stop-opacity="0" />
        <stop offset="1" style="stop-color: var(--accent)" stop-opacity="0.3" />
      </linearGradient>
      <linearGradient id="stream-fade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="white" stop-opacity="0" />
        <stop offset="0.08" stop-color="white" />
        <stop offset="0.92" stop-color="white" />
        <stop offset="1" stop-color="white" stop-opacity="0" />
      </linearGradient>
      <mask id="stream-mask"><rect width="520" height="230" fill="url(#stream-fade)" /></mask>
    </defs>

    {% for y in hero.lattice %}<line class="stream-lattice" x1="0" x2="520" y1="{{ y }}" y2="{{ y }}" />{% endfor %}

    <g mask="url(#stream-mask)">
      <g class="stream-track" style="--shift: -{{ hero.set_width }}px">
        {% for bar in hero.bars %}<rect x="{{ bar.x }}" y="{{ bar.y }}" width="{{ bar.w }}" height="{{ bar.h }}" rx="2" fill="url(#stream-{{ 'off' if bar.off else 'on' }})" />{% endfor %}
      </g>
    </g>

    <rect class="stream-scan" x="0" y="0" width="70" height="204" fill="url(#stream-scan)" />
    <line class="stream-base" x1="0" x2="520" y1="204" y2="204" />
  </svg>

  <figcaption class="stream-legend">
    <span><i class="dot-on"></i> On a multiple of k</span>
    <span><i class="dot-off"></i> Residual beyond tolerance</span>
  </figcaption>

  <div class="stream-models">
    {% for m in MODELS %}<span style="--model: {{ m.color }}">{{ m.name }}</span>{% endfor %}
  </div>
</figure>
